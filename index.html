<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账">
<title>出去玩记账</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🎫</text></svg>">
<style>
:root{
  --paper:#F2F4EF; --surface:#FFFFFF; --ink:#1C2B3A; --muted:#6F7B86; --line:#DCE1DA;
  --gold:#F2B01E; --gold-ink:#1C2B3A; --pos:#22805A; --neg:#C0432F; --chip:#E7EBE4;
  --hl:#FFF6DC;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111821; --surface:#18222E; --ink:#E6EBF0; --muted:#8C98A4; --line:#2A3644;
    --gold:#F2B01E; --gold-ink:#141C25; --pos:#5CC08E; --neg:#F07A64; --chip:#223040;
    --hl:#2A2A1C;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{
  margin:0;color:var(--ink);background:var(--paper);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top,0) 0 calc(104px + env(safe-area-inset-bottom,0));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* 顶部 */
header{padding:18px 0 6px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.total small{display:block;color:var(--muted);font-size:13px}
.total b{display:block;font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.whoami{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.tabs{display:flex;gap:4px;margin:16px 0 4px;padding:4px;background:var(--chip);border-radius:12px}
.tabs button{flex:1;padding:9px 0;border-radius:9px;font-size:15px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* 头像 */
.av{display:inline-block;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.av.s{width:22px;height:22px;font-size:13px}
.av.m{width:30px;height:30px;font-size:17px}
.av.l{width:42px;height:42px;font-size:23px}
.av.xl{width:64px;height:64px;font-size:36px}
.stack{display:flex}
.stack .av{margin-right:-5px;border:2px solid var(--surface)}

/* 账单列表 */
.day{margin:20px 0 6px;font-size:13px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;width:100%;text-align:left;gap:12px;padding:12px 14px;align-items:center}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--chip)}
.mid{flex:1;min-width:0}
.desc{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.meta .own{color:var(--ink);font-weight:600}
.right{text-align:right;flex:none}
.amt{display:block;font-weight:700;font-size:17px}
.mine{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:56px 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* 记一笔按钮 */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0));
  background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:17px;padding:15px 34px;border-radius:999px;
  box-shadow:0 6px 18px rgba(28,43,58,.22);z-index:5}
.fab:active{transform:translateX(-50%) scale(.97)}

/* 结算：转账票根 */
.mycard{margin-top:16px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:14px}
.mycard .big{font-size:26px;font-weight:800;line-height:1.2}
.mycard small{color:var(--muted);font-size:13px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
h2{font-size:15px;font-weight:600;margin:26px 0 10px;color:var(--muted)}
.ticket{position:relative;display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.ticket.me{background:var(--hl);border-color:var(--gold)}
.ticket .who{flex:1;display:flex;align-items:center;gap:10px;padding:14px 14px 14px 14px;min-width:0}
.ticket .who span.n{font-weight:600}
.ticket .arrow{color:var(--muted);font-size:14px;padding:0 2px}
.ticket .stub{position:relative;flex:none;min-width:108px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:10px 16px;border-left:2px dashed var(--line)}
.ticket.me .stub{border-left-color:var(--gold)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket .stub::before{top:-9px;clip-path:inset(50% 0 0 0)}
.ticket .stub::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.ticket.me .stub::before,.ticket.me .stub::after{border-color:var(--gold)}
.stub b{font-size:19px;font-weight:800}
.stub small{font-size:12px;color:var(--muted)}
.done{text-align:center;padding:28px 12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:10px 12px;text-align:right}
th{font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
tr+tr td{border-top:1px solid var(--line)}
td .nm{display:flex;align-items:center;gap:8px}
.danger{margin:32px 0 8px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--neg);color:var(--neg);font-weight:600}

/* 弹层 */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:10;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:92vh;overflow-y:auto;background:var(--surface);
  border-radius:18px 18px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0));transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility .22s}
.sheet.open{transform:none;visibility:visible}
@media (min-width:600px){.sheet{max-width:560px;margin:0 auto}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 14px;font-size:18px}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:6px}
.field>.lbl button{color:var(--ink);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.money{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.money span{font-size:26px;font-weight:700}
.money input{flex:1;min-width:0;border:0;background:none;font-size:34px;font-weight:800;outline:none;padding:0}
.text{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);outline:none}
.text:focus{border-color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:12px;border:1.5px solid transparent;font-size:12px;color:var(--muted)}
.pick button[aria-pressed=true]{border-color:var(--ink);background:var(--chip);color:var(--ink);font-weight:600}
.pick button[aria-pressed=false] .av{opacity:.35;filter:grayscale(.6)}
.seg{display:flex;gap:4px;padding:4px;background:var(--chip);border-radius:10px}
.seg button{flex:1;padding:8px 0;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cats button{padding:6px 11px;border-radius:999px;background:var(--chip);font-size:14px;border:1.5px solid transparent;color:var(--ink)}
.cats button[aria-pressed=true]{border-color:var(--ink);background:var(--surface);font-weight:600}
.tf{margin:0 0 10px}
.split-note{margin-top:10px;font-size:14px;color:var(--muted)}
.exrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.exrow .n{flex:1}
.exrow input{width:120px;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);outline:none}
.exrow input:focus{border-color:var(--ink)}
.diff{margin-top:6px;font-size:14px;font-weight:600}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:16px}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.primary:disabled{opacity:.4}
.btn.ghost{flex:none;padding:14px 18px;border:1px solid var(--line)}
.btn.del{flex:none;padding:14px 18px;color:var(--neg);border:1px solid var(--line)}
.ro{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ro .r{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ro .r+.r{border-top:1px solid var(--line)}
.ro .r .n{flex:1}
.foot{font-size:13px;color:var(--muted);margin-top:12px}

/* 选择身份 */
.picker{position:fixed;inset:0;z-index:20;background:var(--paper);display:none;flex-direction:column;justify-content:center;padding:24px}
.picker.open{display:flex}
.picker h1{font-size:28px;margin:0 0 4px;text-align:center}
.picker p{text-align:center;color:var(--muted);margin:0 0 28px}
.picker .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;margin:0 auto;width:100%}
.picker .grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-weight:600}
.picker .grid button[aria-pressed=true]{border:2px solid var(--ink)}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0));transform:translate(-50%,-150%);opacity:0;z-index:30;
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;transition:transform .2s,opacity .2s;max-width:88vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <div class="total"><small>这次一共花了</small><b class="num" id="total">¥0.00</b></div>
      <button class="whoami" id="whoami" aria-label="切换身份"></button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="bills">账单</button>
      <button role="tab" aria-selected="false" data-tab="settle">结算</button>
    </div>
  </header>
  <main>
    <section id="bills"></section>
    <section id="settle" hidden></section>
  </main>
</div>

<button class="fab" id="fab">记一笔</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="picker" id="picker">
  <h1>你是谁？</h1>
  <p>选一次就记住了，点右上角头像可以换</p>
  <div class="grid" id="pickerGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
const TOKEN = location.pathname.split('/').filter(Boolean)[0];
const API = `/${TOKEN}/api`;
const K_ME = `sb_me_${TOKEN}`, K_ADMIN = `sb_admin_${TOKEN}`;
const ls = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
};

let S = {members:[], expenses:[], settlement:{balances:{}, transfers:[]}};
let me = ls.get(K_ME);
let onlyMine = ls.get('sb_tf') !== 'all';
let admin = ls.get(K_ADMIN);
const qp = new URLSearchParams(location.search);
if (qp.get('admin')) { admin = qp.get('admin'); ls.set(K_ADMIN, admin); history.replaceState(null, '', location.pathname); }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = new Intl.NumberFormat('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
const yuan = c => '¥' + NF.format(c / 100);
const mem = id => S.members.find(m => m.id === id) || {id, name:id, icon:'❔', color:'#888888'};
const av = (id, size='m') => {
  const m = mem(id);
  return ART[m.art] ? `<span class="av ${size} art-${m.art}" title="${esc(m.name)}"></span>`
                    : `<span class="av ${size}" style="background:${m.color}" title="${esc(m.name)}"></span>`;
};
const catOf = id => (S.categories || []).find(c => c.id === id);
function title(e){
  const c = catOf(e.cat);
  if (!c) return e.desc || '（没写备注）';
  return `${c.icon} ${c.name}${e.desc ? ' · ' + e.desc : ''}`;
}

/* ---------------- 头像：程序画的印象派小画，每人一幅 ---------------- */
function rng(seed){
  let a = 0; for (const ch of seed) a = Math.imul(a ^ ch.charCodeAt(0), 2654435761);
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// 一层笔触：在 [x0,y0,x1,y1] 里随机点 n 笔，angle 可以是固定范围也可以是随位置变化的函数
function strokes(R, o){
  const [x0, y0, x1, y1] = o.box || [0, 0, 100, 100];
  const U = (a, b) => a + (b - a) * R();
  let out = '';
  for (let i = 0; i < o.n; i++){
    let x = U(x0, x1), y = U(y0, y1);
    for (let k = 0; o.inside && !o.inside(x, y) && k < 30; k++){ x = U(x0, x1); y = U(y0, y1); }
    const deg = typeof o.ang === 'function' ? o.ang(x, y) + U(-12, 12) : U(o.ang[0], o.ang[1]);
    const l = U(o.len[0], o.len[1]) / 2, a = deg * Math.PI / 180;
    const dx = Math.cos(a) * l, dy = Math.sin(a) * l;
    const c = o.colors[Math.floor(R() * o.colors.length)];
    out += `<line x1="${(x - dx).toFixed(1)}" y1="${(y - dy).toFixed(1)}" x2="${(x + dx).toFixed(1)}" y2="${(y + dy).toFixed(1)}" stroke="${c}" stroke-width="${U(o.w[0], o.w[1]).toFixed(1)}" stroke-linecap="round" opacity="${o.op || .9}"/>`;
  }
  return out;
}
// 沿折线 pts 撒笔触，width(t) 控制离中线多远（t 从 0 到 1）
function along(R, pts, o){
  let out = '';
  for (let i = 0; i < o.n; i++){
    const t = R(), seg = Math.min(pts.length - 2, Math.floor(t * (pts.length - 1))), f = t * (pts.length - 1) - seg;
    const [ax, ay] = pts[seg], [bx, by] = pts[seg + 1];
    const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1, off = (R() - .5) * 2 * o.width(t);
    const x = ax + dx * f - dy / L * off, y = ay + dy * f + dx / L * off, deg = Math.atan2(dy, dx) * 180 / Math.PI;
    out += strokes(R, {n:1, box:[x,y,x,y], colors:o.colors, len:o.len, w:o.w, ang:[deg - 10, deg + 10]});
  }
  return out;
}
// 每幅画都是按各人名字的意象画的
const ART = {
  // lz：林间一条清溪
  stream: R => `<rect width="100" height="100" fill="#3E5E3A"/>`
    + strokes(R, {n:170, colors:['#2F5A33','#4F7D3F','#6F9A4A','#8DB35A','#3C6B3E','#A9C46A'], len:[5,9], w:[4,6], ang:[0,180]})
    + [12,30,74,90].map(x => strokes(R, {n:5, box:[x-2,10,x+2,70], colors:['#3A2E22','#4A3A2A','#2C241B'], len:[12,18], w:[2.5,3.5], ang:[84,96]})).join('')
    + along(R, [[102,40],[70,52],[52,64],[40,80],[30,104]], {n:70, width:t => 2 + t * 11, colors:['#BFE3EC','#8CC7D8','#E9F6F8','#6FB2C8','#FFFFFF'], len:[5,10], w:[2.5,4]}),
  // gq：一轮满月
  moon: R => `<rect width="100" height="100" fill="#1C2447"/>`
    + strokes(R, {n:120, box:[-5,-5,105,72], colors:['#1C2447','#27325E','#33407A','#1A2140','#3B4A86'], len:[8,14], w:[3.5,5], ang:[-15,15]})
    + strokes(R, {n:40, box:[20,8,80,68], colors:['#E9DFA8','#C9C3A0','#8C8FB0','#F4EBC8'], len:[4,7], w:[2.5,3.5], ang:(x, y) => Math.atan2(y - 38, x - 50) * 180 / Math.PI + 90, inside:(x, y) => { const d = Math.hypot(x - 50, y - 38); return d > 19 && d < 28; }})
    + `<circle cx="50" cy="38" r="17" fill="#F4EBC8"/>`
    + strokes(R, {n:10, box:[36,26,64,50], colors:['#E6D9A6','#FFF8DC'], len:[3,6], w:[3,4], ang:[0,180], inside:(x, y) => Math.hypot(x - 50, y - 38) < 14})
    + strokes(R, {n:40, box:[-5,68,105,82], colors:['#2A3A5A','#3A4E74','#C9C3A0','#E9DFA8'], len:[6,12], w:[3,4], ang:[-6,6]})
    + strokes(R, {n:50, box:[-5,80,105,105], colors:['#2A3A3A','#3A4E44','#51624E'], len:[8,14], w:[3.5,5], ang:[-12,12]}),
  // tjn：南方的海边，暖阳和椰子树
  south: R => `<rect width="100" height="100" fill="#F4B27A"/>`
    + strokes(R, {n:70, box:[-5,-5,105,50], colors:['#F7C68A','#F4A76A','#FBD9A0','#F2B880','#F59E7A'], len:[10,16], w:[4,6], ang:[-10,10]})
    + `<circle cx="30" cy="30" r="10" fill="#FFE08A"/>`
    + strokes(R, {n:60, box:[-5,48,105,80], colors:['#2BA6A8','#4CC0BE','#1E8C99','#7AD3CD','#FFE08A'], len:[8,14], w:[3,4.5], ang:[-6,6]})
    + strokes(R, {n:40, box:[-5,78,105,105], colors:['#F1D7A6','#E8C58A','#F6E3BD'], len:[8,14], w:[4,6], ang:[-12,12]})
    + `<path d="M80 102 Q74 70 70 40" fill="none" stroke="#5A3D24" stroke-width="3.5" stroke-linecap="round"/>`
    + strokes(R, {n:26, box:[52,24,92,56], colors:['#2E7A45','#3E9150','#246438','#5AA85E'], len:[8,14], w:[2.5,3.5], ang:(x, y) => Math.atan2(y - 40, x - 70) * 180 / Math.PI, inside:(x, y) => Math.hypot(x - 70, y - 40) < 18}),
  // zxs：一座小小的山，四周云雾环绕
  hill: R => `<rect width="100" height="100" fill="#DCE6EE"/>`
    + strokes(R, {n:80, box:[-5,-5,105,70], colors:['#DCE6EE','#C8D8E6','#EADFE3','#F0ECE4','#B9CCDF'], len:[10,16], w:[4,6], ang:[-10,10]})
    + `<path d="M4 104 Q22 70 40 46 Q50 34 60 46 Q78 70 96 104 Z" fill="#5E8C62"/>`
    + strokes(R, {n:120, box:[4,36,96,104], colors:['#5E8C62','#77A36E','#4A7652','#93B97E','#3F6A4C'], len:[5,9], w:[3,4.5], ang:(x, y) => x < 50 ? -55 : 55, inside:(x, y) => y > 44 + Math.abs(x - 50) * 1.05})
    + strokes(R, {n:50, box:[-5,58,105,72], colors:['#FFFFFF','#EEF2F5','#DDE5EC'], len:[10,18], w:[4,6], ang:[-5,5], op:.85})
    + strokes(R, {n:30, box:[-5,88,105,105], colors:['#3F6A4C','#4A7652','#2F5A3E'], len:[8,14], w:[4,6], ang:[-10,10]}),
  // xmy：秋天高远的天空和大海
  skysea: R => `<rect width="100" height="100" fill="#9CC6E8"/>`
    + strokes(R, {n:80, box:[-5,-5,105,55], colors:['#9CC6E8','#B8D6EE','#7FB2DE','#E8E0C8','#CFE2F2'], len:[10,18], w:[4,6], ang:[-8,8]})
    + strokes(R, {n:14, box:[10,12,90,30], colors:['#FFFFFF','#F4F1E6'], len:[10,18], w:[2,3], ang:[-6,6], op:.8})
    + `<path d="M30 26 q4 -4 8 0 q4 -4 8 0" fill="none" stroke="#2A3440" stroke-width="1.6" stroke-linecap="round"/>`
    + strokes(R, {n:110, box:[-5,54,105,105], colors:['#1E4F8A','#2A64A3','#173E70','#3D7BB8','#12325E'], len:[8,14], w:[3.5,5], ang:[-8,8]})
    + strokes(R, {n:26, box:[0,58,100,100], colors:['#FFFFFF','#DDEBF6'], len:[3,6], w:[2,3], ang:[-10,10]}),
  // hjy：一片开得热闹的花
  joy: R => {
    let s = `<rect width="100" height="100" fill="#F4E6A8"/>`
      + strokes(R, {n:100, colors:['#F5E3A0','#EFD98C','#F8EDC0','#CFE0A0','#B8D48A'], len:[8,14], w:[4,6], ang:[0,180]});
    const cols = ['#E84A5F','#FF847C','#F9A826','#6C5CE7','#2EC4B6','#FF6B9A','#FFFFFF'];
    for (const [cx, cy] of [[24,26],[62,18],[82,46],[44,50],[18,70],[66,78],[40,90],[88,86]]){
      const c = cols[Math.floor(R() * cols.length)];
      s += strokes(R, {n:9, box:[cx-8,cy-8,cx+8,cy+8], colors:[c], len:[4,7], w:[3.5,4.5], ang:(x, y) => Math.atan2(y - cy, x - cx) * 180 / Math.PI, inside:(x, y) => { const d = Math.hypot(x - cx, y - cy); return d > 3 && d < 8; }})
        + `<circle cx="${cx}" cy="${cy}" r="2.6" fill="#F9D923"/>`;
    }
    return s;
  },
};
let artReady = false;
function injectArt(){
  if (artReady || !S.members.length) return;
  artReady = true;
  const css = S.members.filter(m => ART[m.art]).map(m => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${ART[m.art](rng(m.id))}</svg>`;
    return `.art-${m.art}{background-image:url("data:image/svg+xml,${encodeURIComponent(svg)}")}`;
  }).join('\n');
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
}
function toCents(s){
  s = String(s).trim().replace(/[,，\s¥]/g, '').replace('。', '.');
  if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
  const [a, b = ''] = s.split('.');
  return parseInt(a, 10) * 100 + parseInt((b + '00').slice(0, 2), 10);
}
const centsToInput = c => (c % 100 === 0) ? String(c / 100) : (c / 100).toFixed(2);

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }

async function api(method, path, body){
  const res = await fetch(API + path, {
    method,
    headers: {'Content-Type':'application/json', 'X-Member': me || '', 'X-Admin': admin || ''},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((data && data.error) || `出错了（${res.status}）`);
  return data;
}

// 每次请求编号：后台刷新如果比刚提交的操作晚返回，就丢掉，避免刚记的账闪一下又没了
let seq = 0, offline = false;
async function load(){
  const my = ++seq;
  try {
    const data = await api('GET', '/state');
    if (my !== seq) return;
    S = data; render();
    if (offline){ offline = false; toast('网络恢复了'); }
  } catch(e){
    if (!offline){ offline = true; toast('连不上服务器，检查一下网络，会自动重试'); }
  }
}
async function mutate(method, path, body){ ++seq; const data = await api(method, path, body); ++seq; return data; }

/* ---------------- 渲染 ---------------- */
function render(){
  if (me && !S.members.some(m => m.id === me)) me = null;
  injectArt();
  const total = S.expenses.reduce((a, e) => a + e.amount, 0);
  $('#total').textContent = yuan(total);
  $('#whoami').innerHTML = me ? `${av(me)}<span>${esc(mem(me).name)}</span>` : '选择身份';
  renderBills(); renderSettle(); renderPicker();
  if (!me) $('#picker').classList.add('open');
}

function renderBills(){
  const el = $('#bills');
  if (!S.expenses.length){
    el.innerHTML = `<div class="empty"><b>还没有账</b>谁付了钱，点下面「记一笔」</div>`;
    return;
  }
  const sorted = [...S.expenses].sort((a, b) => b.created_at - a.created_at);
  const groups = [];
  for (const e of sorted){
    const d = new Date(e.created_at * 1000);
    const key = d.toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'short'});
    if (!groups.length || groups[groups.length - 1].key !== key) groups.push({key, items: []});
    groups[groups.length - 1].items.push(e);
  }
  const n = S.members.length;
  el.innerHTML = groups.map(g => `
    <div class="day">${esc(g.key)}</div>
    <div class="list">${g.items.map(e => {
      const myShare = e.shares[me] || 0;
      const who = e.participants.length === n ? '全员' : `${e.participants.length} 人`;
      const how = e.split === 'equal' ? '平分' : '按金额分';
      const own = e.created_by === me ? '，<span class="own">我记的</span>' : '';
      return `<button class="item" data-id="${e.id}">
        ${av(e.payer, 'l')}
        <span class="mid">
          <span class="desc">${esc(title(e))}</span>
          <span class="meta">${esc(mem(e.payer).name)} 付，${who}${how}${own}</span>
        </span>
        <span class="right">
          <span class="amt num">${yuan(e.amount)}</span>
          <span class="mine num">${myShare ? '我摊 ' + yuan(myShare) : '与我无关'}</span>
        </span>
      </button>`;
    }).join('')}</div>`).join('');
}

function renderSettle(){
  const el = $('#settle');
  const {balances, transfers} = S.settlement;
  const b = balances[me];
  let mine = '';
  if (me && b){
    const cls = b.net > 0 ? 'pos' : b.net < 0 ? 'neg' : '';
    const txt = b.net > 0 ? `还应收 ${yuan(b.net)}` : b.net < 0 ? `还要付 ${yuan(-b.net)}` : '你两清了';
    mine = `<div class="mycard">${av(me, 'xl')}<div><small>你垫付 ${yuan(b.paid)}，应摊 ${yuan(b.owed)}</small><div class="big num ${cls}">${txt}</div></div></div>`;
  }
  const mineOnly = onlyMine && me;
  const shown = mineOnly ? transfers.filter(t => t.from === me || t.to === me) : transfers;
  const filter = me && transfers.length ? `<div class="seg tf"><button data-tf="mine" aria-pressed="${!!mineOnly}">只看我的</button><button data-tf="all" aria-pressed="${!mineOnly}">全部</button></div>` : '';
  const tickets = shown.length ? shown.map(t => {
    const isMe = t.from === me || t.to === me;
    const tag = t.from === me ? '你付' : t.to === me ? '你收' : '转账';
    return `<div class="ticket${isMe ? ' me' : ''}">
      <div class="who">${av(t.from)}<span class="n">${esc(mem(t.from).name)}</span><span class="arrow">转给</span>${av(t.to)}<span class="n">${esc(mem(t.to).name)}</span></div>
      <div class="stub"><small>${tag}</small><b class="num">${yuan(t.amount)}</b></div>
    </div>`;
  }).join('') : `<div class="done">${!S.expenses.length ? '记了账之后，这里会算出谁转给谁' : !transfers.length ? '所有人都两清了' : '你不用转钱给别人，也没人要转给你'}</div>`;

  const rows = S.members.map(m => {
    const x = balances[m.id] || {paid:0, owed:0, net:0};
    const cls = x.net > 0 ? 'pos' : x.net < 0 ? 'neg' : '';
    return `<tr><td><span class="nm">${av(m.id, 's')}${esc(m.name)}</span></td>
      <td class="num">${yuan(x.paid)}</td><td class="num">${yuan(x.owed)}</td>
      <td class="num ${cls}">${x.net > 0 ? '+' : ''}${yuan(x.net).replace('¥-', '-¥')}</td></tr>`;
  }).join('');

  el.innerHTML = `${mine}
    <h2>最少 ${transfers.length} 笔转账就能结清</h2>
    ${filter}${tickets}
    <h2>每个人的账</h2>
    <table><thead><tr><th>成员</th><th>垫付</th><th>应摊</th><th>净额</th></tr></thead><tbody>${rows}</tbody></table>
    ${admin ? `<button class="danger" id="reset">清空账本（会自动备份）</button>` : ''}`;
}

function renderPicker(){
  $('#pickerGrid').innerHTML = S.members.map(m =>
    `<button data-me="${m.id}" aria-pressed="${m.id === me}">${av(m.id, 'xl')}<span>${esc(m.name)}</span></button>`).join('');
}

/* ---------------- 记一笔 / 编辑 ---------------- */
let F = null; // 当前表单

function openSheet(expense){
  const all = S.members.map(m => m.id);
  if (expense){
    const editable = expense.created_by === me;
    F = {
      id: expense.id, readonly: !editable, e: expense,
      amount: centsToInput(expense.amount), cat: expense.cat || '', desc: expense.desc, payer: expense.payer,
      parts: new Set(expense.participants), split: expense.split,
      exact: Object.fromEntries(Object.entries(expense.shares).map(([k, v]) => [k, centsToInput(v)])),
    };
  } else {
    F = {id: null, readonly: false, amount: '', cat: '', desc: '', payer: me, parts: new Set(all), split: 'equal', exact: {}};
  }
  $('#sheet').innerHTML = F.readonly ? readonlyHTML() : formHTML();
  $('#scrim').classList.add('open'); $('#sheet').classList.add('open');
  if (!F.readonly){ updateSplit(); if (!F.id) setTimeout(() => $('#f-amount').focus(), 250); }
}
function closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); F = null; }

function readonlyHTML(){
  const e = F.e;
  const t = new Date(e.created_at * 1000).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
  return `<div class="grab"></div>
    <h3>${esc(title(e))}</h3>
    <div class="money" style="border:0"><span>¥</span><b class="num" style="font-size:34px">${NF.format(e.amount / 100)}</b></div>
    <div class="field" style="margin-top:14px"><div class="lbl">${esc(mem(e.payer).name)} 付的，${e.split === 'equal' ? '平分' : '按金额分'}</div>
      <div class="ro">${e.participants.map(p => `<div class="r">${av(p)}<span class="n">${esc(mem(p).name)}</span><span class="num">${yuan(e.shares[p] || 0)}</span></div>`).join('')}</div>
    </div>
    <div class="foot">${esc(mem(e.created_by).name)} 在 ${t} 记的。只有 ta 能修改这笔账。</div>
    <div class="actions"><button class="btn ghost" style="flex:1" data-act="close">关闭</button></div>`;
}

function formHTML(){
  return `<div class="grab"></div>
    <h3>${F.id ? '修改这笔账' : '记一笔'}</h3>
    <div class="field">
      <label for="f-amount">多少钱</label>
      <div class="money"><span>¥</span><input id="f-amount" class="num" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${esc(F.amount)}"></div>
    </div>
    <div class="field">
      <label for="f-desc">花在哪了</label>
      <div class="cats" id="f-cats"></div>
      <input id="f-desc" class="text" maxlength="60" placeholder="再写点备注，比如：海底捞、机场到酒店（可不填）" value="${esc(F.desc)}">
    </div>
    <div class="field"><div class="lbl">谁付的</div><div class="pick" id="f-payer"></div></div>
    <div class="field"><div class="lbl"><span>谁参与</span><button type="button" data-act="all">全选</button></div><div class="pick" id="f-parts"></div></div>
    <div class="field">
      <div class="lbl">怎么分</div>
      <div class="seg"><button data-split="equal">平均分</button><button data-split="exact">按金额分</button></div>
      <div id="f-split"></div>
    </div>
    <div class="actions">
      ${F.id ? '<button class="btn del" data-act="delete">删除</button>' : ''}
      <button class="btn primary" id="f-save" data-act="save">${F.id ? '保存修改' : '记下来'}</button>
    </div>`;
}

function renderPicks(){
  $('#f-cats').innerHTML = (S.categories || []).map(c =>
    `<button type="button" data-cat="${c.id}" aria-pressed="${F.cat === c.id}">${c.icon} ${esc(c.name)}</button>`).join('');
  $('#f-payer').innerHTML = S.members.map(m =>
    `<button type="button" data-payer="${m.id}" aria-pressed="${F.payer === m.id}">${av(m.id)}${esc(m.name)}</button>`).join('');
  $('#f-parts').innerHTML = S.members.map(m =>
    `<button type="button" data-part="${m.id}" aria-pressed="${F.parts.has(m.id)}">${av(m.id)}${esc(m.name)}</button>`).join('');
  document.querySelectorAll('.seg [data-split]').forEach(b => b.setAttribute('aria-pressed', b.dataset.split === F.split));
}

function orderedParts(){ return S.members.map(m => m.id).filter(id => F.parts.has(id)); }

function updateSplit(){
  renderPicks();
  const box = $('#f-split');
  const parts = orderedParts();
  if (F.split === 'equal'){
    box.innerHTML = `<div class="split-note" id="f-note"></div>`;
  } else {
    box.innerHTML = parts.map(p => `<div class="exrow">${av(p)}<span class="n">${esc(mem(p).name)}</span>
      <input class="num" inputmode="decimal" data-ex="${p}" placeholder="0" value="${esc(F.exact[p] || '')}"></div>`).join('')
      + `<div class="diff num" id="f-note"></div>`;
  }
  updateNote();
}

function validate(){
  const amt = toCents(F.amount);
  const parts = orderedParts();
  if (!(amt > 0)) return {ok:false, msg: F.amount ? '金额格式不对，最多两位小数' : ''};
  if (!F.payer) return {ok:false, msg:'选一下谁付的'};
  if (!parts.length) return {ok:false, msg:'至少选一个参与的人'};
  if (F.split === 'equal'){
    const per = Math.floor(amt / parts.length), rem = amt % parts.length;
    return {ok:true, amt, parts, msg: `${parts.length} 人平分，每人 ${yuan(per)}${rem ? '（有人多 1 分）' : ''}`};
  }
  const exact = {};
  let sum = 0;
  for (const p of parts){
    const v = F.exact[p] ? toCents(F.exact[p]) : 0;
    if (Number.isNaN(v)) return {ok:false, msg:`${mem(p).name} 的金额格式不对`};
    exact[p] = v; sum += v;
  }
  if (sum !== amt){
    const d = amt - sum;
    return {ok:false, bad:true, msg: d > 0 ? `还差 ${yuan(d)} 没分出去` : `多分了 ${yuan(-d)}`};
  }
  return {ok:true, amt, parts, exact, msg:'刚好分完'};
}

function updateNote(){
  const v = validate();
  const note = $('#f-note');
  if (note){
    note.textContent = v.msg || '';
    note.className = (F.split === 'exact' ? 'diff num ' : 'split-note ') + (F.split === 'exact' ? (v.ok ? 'pos' : 'neg') : '');
  }
  $('#f-save').disabled = !v.ok;
}

async function save(){
  const v = validate();
  if (!v.ok) return toast(v.msg || '先填金额');
  const body = {cat: F.cat, desc: F.desc.trim(), amount: v.amt, payer: F.payer, participants: v.parts, split: F.split};
  if (F.split === 'exact') body.exact = v.exact;
  const btn = $('#f-save'); btn.disabled = true;
  try {
    S = F.id ? await mutate('PUT', `/expenses/${F.id}`, body) : await mutate('POST', '/expenses', body);
    const wasEdit = !!F.id;
    closeSheet(); render(); toast(wasEdit ? '已保存修改' : '记下来了');
  } catch(e){ toast(e.message); btn.disabled = false; }
}

async function del(){
  if (!confirm('删除这笔账？')) return;
  try { S = await mutate('DELETE', `/expenses/${F.id}`); closeSheet(); render(); toast('已删除'); }
  catch(e){ toast(e.message); }
}

/* ---------------- 事件 ---------------- */
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabs [data-tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  $('#bills').hidden = b.dataset.tab !== 'bills';
  $('#settle').hidden = b.dataset.tab !== 'settle';
  $('#fab').hidden = b.dataset.tab !== 'bills';
}));

$('#fab').addEventListener('click', () => me ? openSheet(null) : $('#picker').classList.add('open'));
$('#whoami').addEventListener('click', () => { renderPicker(); $('#picker').classList.add('open'); });
$('#scrim').addEventListener('click', closeSheet);

$('#pickerGrid').addEventListener('click', ev => {
  const b = ev.target.closest('[data-me]'); if (!b) return;
  me = b.dataset.me; ls.set(K_ME, me);
  $('#picker').classList.remove('open'); render();
});

$('#bills').addEventListener('click', ev => {
  const b = ev.target.closest('.item'); if (!b) return;
  const e = S.expenses.find(x => x.id === b.dataset.id); if (e) openSheet(e);
});

$('#settle').addEventListener('click', async ev => {
  const tf = ev.target.closest('[data-tf]');
  if (tf){ onlyMine = tf.dataset.tf === 'mine'; ls.set('sb_tf', tf.dataset.tf); return renderSettle(); }
  if (!ev.target.closest('#reset')) return;
  if (!confirm('清空整个账本？（会自动留一份备份）')) return;
  if (prompt('确认的话输入「清空」') !== '清空') return;
  try { S = await mutate('POST', '/reset'); render(); toast('账本已清空'); }
  catch(e){ toast(e.message); }
});

const sheet = $('#sheet');
sheet.addEventListener('click', ev => {
  if (!F) return;
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.act === 'close') return closeSheet();
  if (t.dataset.act === 'save') return save();
  if (t.dataset.act === 'delete') return del();
  if (t.dataset.act === 'all'){
    const allOn = F.parts.size === S.members.length;
    F.parts = new Set(allOn ? [] : S.members.map(m => m.id));
    return updateSplit();
  }
  if (t.dataset.cat){ F.cat = F.cat === t.dataset.cat ? '' : t.dataset.cat; return renderPicks(); }
  if (t.dataset.payer){ F.payer = t.dataset.payer; return renderPicks(), updateNote(); }
  if (t.dataset.part){ const p = t.dataset.part; F.parts.has(p) ? F.parts.delete(p) : F.parts.add(p); return updateSplit(); }
  if (t.dataset.split){ F.split = t.dataset.split; return updateSplit(); }
});
sheet.addEventListener('input', ev => {
  if (!F) return;
  const t = ev.target;
  if (t.id === 'f-amount') F.amount = t.value;
  else if (t.id === 'f-desc') F.desc = t.value;
  else if (t.dataset.ex) F.exact[t.dataset.ex] = t.value;
  updateNote();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && F) closeSheet(); });

/* 自动同步：别人记的账几秒内就能看到 */
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 8000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
load();
})();
</script>
