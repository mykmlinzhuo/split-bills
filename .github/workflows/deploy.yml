# 合并到 main 就自动部署到 Cloudflare，然后检查线上是不是新版本、密钥和数据库是否正常。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里添加一次 CLOUDFLARE_API_TOKEN。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: cab4c042abce38df1b656a2da12b9554
      SITE: https://split-bills.mykm050721.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN：在仓库 Settings → Secrets and variables → Actions 里添加"
            exit 1
          fi

      - name: Deploy
        run: npx wrangler deploy --var VERSION:${GITHUB_SHA::7}

      - name: Smoke test
        run: |
          want=${GITHUB_SHA::7}
          for i in $(seq 1 12); do
            body=$(curl -fsS "$SITE/healthz" || true)
            echo "healthz: $body"
            if echo "$body" | grep -q "\"version\":\"$want\""; then
              echo "$body" | grep -q '"ok":true' && exit 0
              echo "::error::新版本已上线，但密钥或数据库不正常：$body"
              exit 1
            fi
            sleep 5
          done
          echo "::error::60 秒内没看到新版本 $want 上线"
          exit 1
